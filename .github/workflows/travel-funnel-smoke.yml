name: Travel handoff smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: travel-handoff-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Verify production travel handoffs
        run: node scripts/smoke-travel-production.mjs https://byebi.it
